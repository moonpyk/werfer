# Builds the Windows installer with Velopack and creates a GitHub release from it, when a v<version> tag is pushed.
# The tag must match the version in src/Directory.Build.props
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # Creating the release
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Task 3.x, for the Taskfile
      - uses: go-task/setup-task@v2

      # vpk, from dotnet-tools.json
      - run: dotnet tool restore

      # A tag pushed without bumping the version would ship the previous version's number under a new tag
      - name: Check the tag against the version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild src/Werfer -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version $version in src/Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test

      # The .pfx is stored base64 in a secret. Imported into the runner user's certificate store, dropped with the
      # runner: signtool then finds it by thumbprint, the password never goes through a command line, which would
      # mangle its special characters
      - name: Import the signing certificate
        shell: pwsh
        env:
          SIGN_PFX_CONTENT: ${{ secrets.SIGN_PFX_CONTENT }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          # Without them the task packs unsigned, silently
          if (-not $env:SIGN_PFX_CONTENT -or -not $env:SIGN_PFX_PASSWORD) {
            throw "The SIGN_PFX_CONTENT or SIGN_PFX_PASSWORD secret is missing: the release would ship unsigned"
          }
          $path = Join-Path $env:RUNNER_TEMP "werfer.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGN_PFX_CONTENT))
          $password = ConvertTo-SecureString $env:SIGN_PFX_PASSWORD -AsPlainText -Force
          # The .pfx may hold the issuers' chain too: the signing certificate is the one with the private key
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object HasPrivateKey | Select-Object -First 1
          Remove-Item $path
          if (-not $cert) { throw "The .pfx holds no certificate with a private key" }
          "SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Publish and pack
        run: task publish-win:velopack
        env:
          # For the download of the previous release, see the task
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub's runners are thrown away after the job, but the certificate leaves as soon as signing is done, even on
      # failure: a self-hosted runner would otherwise keep it for the next jobs
      - name: Remove the signing certificate
        if: always() && env.SIGN_CERT_THUMBPRINT != ''
        shell: pwsh
        run: Remove-Item "Cert:\CurrentUser\My\$env:SIGN_CERT_THUMBPRINT"

      # Fails if the tag already has a release: before running the workflow again for the same tag, delete the draft a
      # failed run left behind
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes \
            --draft \
            .publish/releases/werfer-win-Setup.exe \
            .publish/releases/werfer-win-Portable.zip \
            .publish/releases/*-${VERSION}-full.nupkg \
            .publish/releases/*-${VERSION}-delta.nupkg \
            .publish/releases/releases.win.json \
            .publish/releases/RELEASES
