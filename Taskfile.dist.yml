version: "3"
vars:
  DOTNET_WINDOWS_RID: win-x64
  DOTNET_CONFIGURATION: '{{.DOTNET_CONFIGURATION | default "Release"}}'
tasks:
  default: {}

  publish-win:classic:
    desc: Publishes the classic version of the application
    cmd: dotnet publish src/Werfer
      -c {{.DOTNET_CONFIGURATION}}
      -r {{.DOTNET_WINDOWS_RID}}
      -p:PublishSingleFile=true
      -p:SelfContained=false
      -o .publish/{{.DOTNET_WINDOWS_RID}}

  publish-win:aot:
    desc: Publishes the AOT version of the application
    cmd: dotnet publish src/Werfer
      -c {{.DOTNET_CONFIGURATION}}
      -r {{.DOTNET_WINDOWS_RID}}
      -p:PublishAot=true
      -p:TrimmerSingleWarn=false
      -o .publish/{{.DOTNET_WINDOWS_RID}}-aot

  publish-win:velopack:
    desc: Publishes the classic version, then packs it with Velopack (installer, portable zip, update packages)
    vars:
      # The one version, from src/Directory.Build.props
      VERSION:
        sh: dotnet msbuild src/Werfer -getProperty:Version
      # Velopack installs to %LOCALAPPDATA%\<id>, deleted on uninstall. "werfer" is also the settings and logs folder
      # (case doesn't matter on Windows), on purpose: uninstalling leaves nothing behind
      VELOPACK_ID: '{{.VELOPACK_ID | default "werfer"}}'
      # Signed with the certificate of SIGN_CERT_THUMBPRINT, in the user's certificate store, or else with
      # SIGN_PFX_PATH (a .pfx) and SIGN_PFX_PASSWORD; unsigned when neither is set. vpk signs everything it ships, its
      # own Update.exe and Setup.exe included. Timestamped, so the signature outlives the certificate.
      # The thumbprint suits any password: through the .pfx, the password goes through Task's shell, vpk and signtool,
      # and quotes, spaces or %^&! in it get mangled on the way. It stays a shell variable, so Task prints
      # $SIGN_PFX_PASSWORD with the command, not its value
      VPK_SIGN_PARAMS: /fd sha256 /tr http://timestamp.digicert.com /td sha256
      VPK_SIGN_ARGS: >-
        {{if .SIGN_CERT_THUMBPRINT}}--signParams "{{.VPK_SIGN_PARAMS}} /sha1 {{.SIGN_CERT_THUMBPRINT}}"
        {{- else if and .SIGN_PFX_PATH .SIGN_PFX_PASSWORD}}--signParams "{{.VPK_SIGN_PARAMS}} /f \"{{.SIGN_PFX_PATH}}\" /p $SIGN_PFX_PASSWORD"
        {{- end}}
    cmds:
      - task: publish-win:classic
      # vpk refuses a version already in the folder, and keeps older ones there to build delta updates from
      - rm -rf .publish/releases
      # The latest published release, if any, so the pack adds a delta update from it: users then download only what
      # changed. Nothing published yet is not an error; no network only costs the delta. GITHUB_TOKEN, when set (the
      # release workflow does), lifts GitHub's 60 requests an hour for anonymous calls, shared on CI runners
      - cmd: dotnet vpk download github
          --repoUrl https://github.com/moonpyk/werfer
          {{if .GITHUB_TOKEN}}--token $GITHUB_TOKEN{{end}}
          --outputDir .publish/releases
        ignore_error: true
      - dotnet vpk pack
        {{.VPK_SIGN_ARGS}}
        --packId {{.VELOPACK_ID}}
        --packVersion {{.VERSION}}
        --packTitle Werfer
        --packDir .publish/{{.DOTNET_WINDOWS_RID}}
        --mainExe Werfer.exe
        --icon src/Werfer/Assets/Werfer.ico
        --framework net10.0-x64-desktop
        --runtime {{.DOTNET_WINDOWS_RID}}
        --outputDir .publish/releases

  clean-pdb:
    desc: Cleans PDBs from publish directories
    cmds:
      - rm -f .publish/*/*.pdb
