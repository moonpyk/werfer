version: "3"
vars:
  DOTNET_RID: win-x64
tasks:
  default: {}

  publish-classic:
    desc: Publishes the classic version of the application
    cmd: dotnet publish src/Werfer -r {{.DOTNET_RID}} -o .publish/{{.DOTNET_RID}}
  
  publish-aot:
    desc: Publishes the AOT version of the application
    cmd: dotnet publish src/Werfer -r {{.DOTNET_RID}} -p:PublishAot=true -o .publish/{{.DOTNET_RID}}-aot
