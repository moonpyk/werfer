version: "3"
vars:
  DOTNET_WINDOWS_RID: win-x64
  DOTNET_CONFIGURATION: '{{.DOTNET_CONFIGURATION | default "Release"}}'
tasks:
  default: {}

  publish-win:classic:
    desc: Publishes the classic version of the application
    cmd: dotnet publish src/Werfer
      -c {{.DOTNET_CONFIGURATION}}
      -r {{.DOTNET_WINDOWS_RID}}
      -p:PublishSingleFile=true
      -p:SelfContained=false
      -o .publish/{{.DOTNET_WINDOWS_RID}}

  publish-win:aot:
    desc: Publishes the AOT version of the application
    cmd: dotnet publish src/Werfer
      -c {{.DOTNET_CONFIGURATION}}
      -r {{.DOTNET_WINDOWS_RID}}
      -p:PublishAot=true
      -p:TrimmerSingleWarn=false
      -o .publish/{{.DOTNET_WINDOWS_RID}}-aot

  clean-pdb:
    desc: Cleans PDBs from publish directories
    cmds:
      - rm -f .publish/*/*.pdb
